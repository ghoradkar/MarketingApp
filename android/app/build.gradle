//        }


//        release {
//            storeFile file('lifenity_international.jks')
//            storePassword 'Avante@123'
//            keyAlias 'key0'
//            keyPassword 'Avante@123'
//        }


    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
        }
    }
    flavorDimensions "app"
    productFlavors {

        // Lifenity Operational(India)
        lifenityOperational {
            dimension "app"
            versionCode 49
            versionName "5.2.0"
            applicationId "com.lifenity.operational"

            manifestPlaceholders = [
                    appIcon: "@mipmap/lifenity_operational",
                    appName: "@string/lifenityOperational"
            ]
        }


        // Lifenity International (UAE)
        lifenityInternational {
            dimension "app"
            versionCode 11
            versionName "3.00"
            applicationId "com.lifenitywellness.uae"
            manifestPlaceholders = [
                    appIcon: "@mipmap/uae",
                    appName: "@string/lifenityInternational"
            ]
        }

        // Plucare Operational Old
        pluscareOperational {
            dimension "app"
            versionCode 24
            versionName "4.4.0"
            applicationId "com.innowavehealthcare.pluscarecollectionboy"
            manifestPlaceholders = [
                    appIcon: "@mipmap/pluscare_operational",
                    appName: "@string/pluscareOperational"
            ]
        }


        // Plucare Operational new
