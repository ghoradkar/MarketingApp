plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.marketingapp"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.marketingapp"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        ///for hindlab
//                release {
//                    storeFile file('hindlab_operational.jks')
//                    storePassword 'Avante@123'
//                    keyAlias 'key0'
//                    keyPassword 'Avante@123'
//                }

        ///for pluscare op old
        release {
            storeFile file('D:/marketingapp/marketingapp/android/app/old_pluscare_jks/pluscareoperational.jks')
            storePassword 'Avante@123'
            keyAlias 'pluscareoperational'
            keyPassword 'Avante@123'
        }

        ///for pluscare op new
        ///use for csc aslo
