//                    appName: "@string/pluscareOperational"
//            ]
//        }

        // HindLab Operational
        hindLabOperational {
            dimension "app"
            versionCode 64
            versionName "9.0.0"
            applicationId "com.innowavehealthcare.hindlabscollectionboy"
            //applicationId "com.hindlab.operational"
            manifestPlaceholders = [
